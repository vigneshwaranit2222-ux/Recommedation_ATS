version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-velai_ats}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velai} -d ${POSTGRES_DB:-velai_ats}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-velai_ats}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env}
      HF_CHAT_MODEL_PRIMARY: ${HF_CHAT_MODEL_PRIMARY:-Qwen/Qwen2.5-Coder-32B-Instruct}
      HF_CHAT_MODEL_INTERVIEW: ${HF_CHAT_MODEL_INTERVIEW:-meta-llama/Llama-3.1-8B-Instruct}
      HF_CHAT_MODEL_SCORING: ${HF_CHAT_MODEL_SCORING:-deepseek-ai/DeepSeek-R1-Distill-Qwen-14B}
      CHROMA_PERSIST_DIR: /app/chroma_data
    volumes:
      - ./chroma_data:/app/chroma_data
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: